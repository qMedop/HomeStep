<html lang="en">

                </svg>
              </div>
              <p id="temperature">25°C</p>
            </button>
            <div class="weather-popup glass-bg">
              <div class="weather-top">
                <div class="weather-icon icon"></div>

                <div class="weather-info">
                  <div class="weather-temp">24°</div>
                  <div class="weather-condition">Clear Sky</div>
                </div>
              </div>

              <div class="weather-details">
                <div class="weather-item">
                  <span>Humidity</span>
                  <span class="humidity">52%</span>
                </div>

                <div class="weather-item">
                  <span>Wind</span>
                  <span class="wind">14 km/h</span>
                </div>

                <div class="weather-item">
                  <span>Feels Like</span>
                  <span class="feels-like">26°</span>
                </div>
              </div>
            </div>
          </div>

            <div id="settingsPopup" class="settings-popup glass-bg">
              <h3>Preferences</h3>
              <hr class="settings-divider" />

              <div class="settings-group">
                <label class="toggle-item">
                  <span>Show Time & Date</span>
                  <input type="checkbox" id="toggleTime" checked />
                  <span class="slider"></span>
                </label>
                <label class="toggle-item">
                  <span>Show Weather</span>
                  <input type="checkbox" id="toggleWeather" checked />
                  <span class="slider"></span>
                </label>
                <label class="toggle-item">
                  <span>Show Shortcuts</span>
                  <input type="checkbox" id="toggleShortcuts" checked />
                  <span class="slider"></span>
                </label>
                <label class="toggle-item">
                  <span>Show Search Options</span>
                  <input type="checkbox" id="toggleSearchOptions" checked />
                  <span class="slider"></span>
                </label>
              </div>

              <div id="locationSettingBlock" class="settings-location-block">
                <h4>Weather Location</h4>
                <p id="locationStatusMsg" class="location-status-msg">
                  Allow location access, or enter your city:
                </p>
                <div class="city-input-container">
                  <input
                    type="text"
                    id="manualCityInput"
                    placeholder="Enter City name (e.g. London)..."
                  />
                  <button type="button" id="saveCityBtn" class="glass-bg">
                    Save
                  </button>
                </div>
              </div>

              <div class="settings-add-item">
                <h4>Add Custom Shortcut</h4>
                <input
                  type="text"
                  id="customTitle"
                  placeholder="Title (e.g., GitHub)"
                />
                <input
                  type="text"
                  id="customUrl"
                  placeholder="URL (https://...)"
                />
                <input
                  type="text"
                  id="customSearchUrl"
                  placeholder="Search Query URL (Optional)"
                />
                <div class="checkbox-row">
                  <label
                    ><input type="checkbox" id="customAppend" checked /> Grid
                    Shortcut</label
                  >
                  <label
                    ><input type="checkbox" id="customSearchAppend" checked />
                    Search Option</label
                  >
                </div>
                <button
                  type="button"
                  id="addCustomItemBtn"
                  class="add-btn glass-bg"
                >
                  Create Item
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
